<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// ============================================================
// 全局影调契约：所有材质与后期共用同一套雾/夜景基准
// ============================================================
const FOG_COLOR = new THREE.Color(0x0a1124);
const FOG_NEAR = 31, FOG_FAR = 118;

const WARM = {
  pos: new THREE.Vector3(-1.5, 2.3, 6.6),   // 店内暖光世界坐标（主光源）
  color: new THREE.Color(0xffab5e),
  power: 1.25
};

// ============================================================
// 渲染器 / 场景 / 相机
// ============================================================
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(FOG_COLOR.clone(), FOG_NEAR, FOG_FAR);

// 长焦低机位：压缩透视，得到微缩模型摄影的「移轴感」
const camera = new THREE.PerspectiveCamera(33, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(-11.2, 9.4, 24.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.9, 2.9, 3.2);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.minDistance = 10;
controls.maxDistance = 42;
controls.minPolarAngle = 0.35;
controls.maxPolarAngle = 1.46;
controls.update();

const clock = new THREE.Clock();

// ============================================================
// 后期链：Render → Bloom → 调色/雾化/移轴/颗粒（FinalPass）
// ============================================================
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.40, 0.72, 0.74);
composer.addPass(bloomPass);

const FinalShader = {
  uniforms: {
    tDiffuse: { value: null },
    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    uTime: { value: 0 }
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform vec2 uResolution;
    uniform float uTime;
    varying vec2 vUv;

    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
    float luma(vec3 c) { return dot(c, vec3(0.2126, 0.7152, 0.0722)); }

    void main() {
      vec2 uv = vUv;
      vec2 cc = uv - 0.5;
      float r2 = dot(cc, cc);

      // --- 1. 极轻的径向色差（镜头感，几乎察觉不到但在暗部能读到） ---
      float ca = r2 * 0.0055;
      vec3 col;
      col.r = texture2D(tDiffuse, uv + cc * ca).r;
      col.g = texture2D(tDiffuse, uv).g;
      col.b = texture2D(tDiffuse, uv - cc * ca).b;

      // --- 2. 移轴虚化：中部横带清晰，上下渐糊（微缩模型摄影的灵魂） ---
      float band = smoothstep(0.14, 0.56, abs(uv.y - 0.44));
      band = max(band, smoothstep(0.22, 0.66, abs(cc.x) * 1.30));
      band = clamp(band, 0.0, 1.0);
      if (band > 0.012) {
        vec2 px = vec2(band * 4.2 / uResolution.x, band * 4.2 / uResolution.y);
        vec3 bl = texture2D(tDiffuse, uv).rgb;
        bl += texture2D(tDiffuse, uv + vec2( px.x, 0.0)).rgb;
        bl += texture2D(tDiffuse, uv - vec2( px.x, 0.0)).rgb;
        bl += texture2D(tDiffuse, uv + vec2( 0.0, px.y)).rgb;
        bl += texture2D(tDiffuse, uv - vec2( 0.0, px.y)).rgb;
        bl += texture2D(tDiffuse, uv + px * 0.72).rgb;
        bl += texture2D(tDiffuse, uv - px * 0.72).rgb;
        bl += texture2D(tDiffuse, uv + vec2( px.x, -px.y) * 0.72).rgb;
        bl += texture2D(tDiffuse, uv + vec2(-px.x,  px.y) * 0.72).rgb;
        bl /= 9.0;
        col = mix(col, bl, 0.72);
      }

      // --- 3. 高光柔性压缩（避免招牌死白，同时保留发光感） ---
      col = col / (1.0 + col * 0.20);

      // --- 4. 冷暖分离调色：暗部压向靛蓝，亮部推向暖白 ---
      float l = luma(col);
      vec3 tint = mix(vec3(0.44, 0.63, 1.02), vec3(1.06, 0.93, 0.78), smoothstep(0.015, 0.62, l));
      col *= mix(vec3(1.0), tint, 0.62);

      // --- 5. 对比 S 曲线 + 轻微提饱和 ---
      col = mix(col, col * col * (3.0 - 2.0 * col), 0.22);
      float l2 = luma(col);
      col = mix(vec3(l2), col, 1.14);

      // --- 6. 暗角 ---
      float vig = 1.0 - smoothstep(0.26, 1.02, length(cc * vec2(1.12, 0.94)));
      col *= mix(0.52, 1.0, vig);

      // --- 7. 胶片颗粒（暗部更明显，模拟高感光） ---
      float g = hash(uv * uResolution + fract(uTime) * 137.0) - 0.5;
      col += g * (0.040 - 0.020 * smoothstep(0.0, 0.55, l2));

      // --- 8. 黑位微抬，避免死黑与断层 ---
      col = max(col, vec3(0.006, 0.008, 0.016));

      gl_FragColor = vec4(col, 1.0);
    }
  `
};
const finalPass = new ShaderPass(FinalShader);
finalPass.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
composer.addPass(finalPass);

// ============================================================
// 三渲二 Cel 材质（分档 + 店内暖光溢出 + 轮廓光 + 距离雾）
// ============================================================
const celVert = /* glsl */`
varying vec3 vN;
varying vec3 vP;
void main() {
  vN = normalize(mat3(modelMatrix) * normal);
  vP = (modelMatrix * vec4(position, 1.0)).xyz;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;

const celFrag = /* glsl */`
uniform vec3 uColor;
uniform vec3 uEmissive;
uniform vec3 uLightDir;
uniform vec3 uShadow;
uniform vec3 uRim;
uniform vec3 uWarmColor;
uniform vec3 uWarmPos;
uniform float uWarmPower;
uniform vec3 uFogColor;
uniform float uFogNear;
uniform float uFogFar;
uniform float uOpacity;
uniform float uGrime;
varying vec3 vN;
varying vec3 vP;

void main() {
  vec3 n = normalize(vN);
  float ndl = dot(n, normalize(uLightDir));

  // 三档硬边明暗（赛璐璐色块）；整体下调以留出夜间暗部
  float band = ndl < 0.02 ? 0.30 : (ndl < 0.46 ? 0.56 : 1.0);
  vec3 col = uColor * band;

  // 背光面压向冷蓝紫，而非纯黑
  float dark = 1.0 - smoothstep(-0.05, 0.34, ndl);
  col = mix(col, uColor * uShadow, dark * 0.88);

  // 店内暖光溢出：靠近玻璃的表面被染暖（夜间唯一的主光源）
  vec3 toW = uWarmPos - vP;
  float dW = length(toW);
  float att = uWarmPower / (1.0 + 0.055 * dW * dW);
  float wndl = max(dot(n, normalize(toW)), 0.0);
  col += uWarmColor * (wndl * att * 0.46);

  // 轮廓光：让暗部形体从背景里浮出来
  vec3 vd = normalize(cameraPosition - vP);
  float fres = pow(1.0 - abs(dot(n, vd)), 2.6);
  col += uRim * fres;

  col += uEmissive;

  // 低频污渍/材质起伏：破掉大面积平涂（用世界坐标、不含时间项，不会闪）
  float gn = sin(vP.x * 1.7 + vP.z * 0.9) * 0.5
           + sin(vP.y * 2.3 - vP.x * 1.1) * 0.3
           + sin(vP.z * 3.1 + vP.y * 0.7) * 0.2;
  col *= 1.0 + gn * uGrime;

  // 距离雾（与 scene.fog 同基准）
  float fogF = smoothstep(uFogNear, uFogFar, length(cameraPosition - vP));
  col = mix(col, uFogColor, fogF);

  gl_FragColor = vec4(col, uOpacity);
}`;

const CEL_DEFAULTS = {
  uColor: { value: new THREE.Color(0xffffff) },
  uEmissive: { value: new THREE.Color(0x000000) },
  uLightDir: { value: new THREE.Vector3(-0.46, 0.70, 0.54).normalize() },
  uShadow: { value: new THREE.Color(0.30, 0.40, 0.72) },
  uRim: { value: new THREE.Color(0.20, 0.32, 0.62) },
  uWarmColor: { value: WARM.color.clone() },
  uWarmPos: { value: WARM.pos.clone() },
  uWarmPower: { value: WARM.power },
  uFogColor: { value: FOG_COLOR.clone() },
  uFogNear: { value: FOG_NEAR },
  uFogFar: { value: FOG_FAR },
  uOpacity: { value: 1.0 },
  uGrime: { value: 0.045 }
};

function cel(color, opt = {}) {
  const m = new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.clone(CEL_DEFAULTS),
    vertexShader: celVert,
    fragmentShader: celFrag
  });
  m.uniforms.uColor.value = new THREE.Color(color);
  if (opt.emissive !== undefined) m.uniforms.uEmissive.value = new THREE.Color(opt.emissive);
  if (opt.shadow !== undefined) m.uniforms.uShadow.value = new THREE.Color(opt.shadow);
  if (opt.rim !== undefined) m.uniforms.uRim.value = new THREE.Color(opt.rim);
  if (opt.warm !== undefined) m.uniforms.uWarmPower.value = opt.warm;
  if (opt.grime !== undefined) m.uniforms.uGrime.value = opt.grime;
  if (opt.opacity !== undefined) { m.uniforms.uOpacity.value = opt.opacity; m.transparent = true; }
  return m;
}

const basic = (color, opt = {}) => new THREE.MeshBasicMaterial(Object.assign({ color }, opt));

// 描边（反转壳）
const outlineMat = new THREE.MeshBasicMaterial({ color: 0x05070f, side: THREE.BackSide });

function add(parent, geometry, material, o = {}) {
  const m = new THREE.Mesh(geometry, material);
  m.position.set(o.x ?? 0, o.y ?? 0, o.z ?? 0);
  if (o.rx || o.ry || o.rz) m.rotation.set(o.rx ?? 0, o.ry ?? 0, o.rz ?? 0);
  if (o.scale) m.scale.setScalar(o.scale);
  parent.add(m);
  if (o.outline) {
    const om = new THREE.Mesh(geometry, outlineMat);
    om.position.copy(m.position);
    om.rotation.copy(m.rotation);
    om.scale.copy(m.scale).multiplyScalar(1.035);
    parent.add(om);
  }
  return m;
}

// ============================================================
// 贴图工厂
// ============================================================
const shadowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 2, 64, 64, 64);
  g.addColorStop(0, 'rgba(3,5,12,0.92)');
  g.addColorStop(0.55, 'rgba(3,5,12,0.46)');
  g.addColorStop(1, 'rgba(3,5,12,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();

const glowTexShared = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.22, 'rgba(255,255,255,0.62)');
  g.addColorStop(0.55, 'rgba(255,255,255,0.16)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();

// 湿地倒影：竖长渐变 + 横向破碎噪声（关键质感）
const streakTex = (() => {
  const c = document.createElement('canvas'); c.width = 128; c.height = 512;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0, 'rgba(255,255,255,0.95)');
  g.addColorStop(0.18, 'rgba(255,255,255,0.62)');
  g.addColorStop(0.42, 'rgba(255,255,255,0.30)');
  g.addColorStop(0.72, 'rgba(255,255,255,0.09)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 512);
  // 横向羽化：避免倒影出现矩形硬边
  ctx.globalCompositeOperation = 'destination-in';
  const hg = ctx.createLinearGradient(0, 0, 128, 0);
  hg.addColorStop(0, 'rgba(0,0,0,0)');
  hg.addColorStop(0.22, 'rgba(0,0,0,0.85)');
  hg.addColorStop(0.5, 'rgba(0,0,0,1)');
  hg.addColorStop(0.78, 'rgba(0,0,0,0.85)');
  hg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = hg; ctx.fillRect(0, 0, 128, 512);
  // 横向水波破碎
  ctx.globalCompositeOperation = 'destination-out';
  for (let y = 0; y < 512; y += 3) {
    const a = 0.12 + Math.random() * 0.42;
    ctx.fillStyle = `rgba(0,0,0,${a})`;
    ctx.fillRect(0, y, 128, 1 + Math.random() * 2);
  }
  ctx.globalCompositeOperation = 'source-over';
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

function textTexture(text, opt = {}) {
  const w = opt.w ?? 512, h = opt.h ?? 128;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = opt.bg ?? 'rgba(0,0,0,0)';
  ctx.fillRect(0, 0, w, h);
  ctx.font = opt.font ?? `bold ${Math.round(h * 0.66)}px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = opt.color ?? '#ffffff';
  if (opt.glow) { ctx.shadowColor = opt.glow; ctx.shadowBlur = h * 0.22; }
  if (opt.stroke) { ctx.strokeStyle = opt.stroke; ctx.lineWidth = opt.strokeW ?? 6; ctx.strokeText(text, w / 2, h / 2); }
  ctx.fillText(text, w / 2, h / 2);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 8;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// 人行道湿砖纹理（含砖缝 + 湿斑，破除大平涂）
const pavingTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#3a4152'; ctx.fillRect(0, 0, 256, 256);
  for (let y = 0; y < 4; y++) {
    for (let x = 0; x < 4; x++) {
      const v = 0.5 + Math.random() * 0.5;
      const shade = Math.round(52 + v * 26);
      ctx.fillStyle = `rgb(${shade},${shade + 6},${shade + 18})`;
      ctx.fillRect(x * 64 + 2, y * 64 + 2, 60, 60);
    }
  }
  ctx.fillStyle = 'rgba(6,8,16,0.55)';
  for (let i = 0; i <= 4; i++) { ctx.fillRect(i * 64 - 1, 0, 2, 256); ctx.fillRect(0, i * 64 - 1, 256, 2); }
  // 湿斑
  for (let i = 0; i < 26; i++) {
    const g = ctx.createRadialGradient(Math.random() * 256, Math.random() * 256, 0, 0, 0, 1);
    ctx.globalAlpha = 0.10 + Math.random() * 0.16;
    ctx.fillStyle = '#0a0e1a';
    ctx.beginPath();
    ctx.ellipse(Math.random() * 256, Math.random() * 256, 18 + Math.random() * 40, 12 + Math.random() * 26, Math.random() * 3, 0, 7);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

// 湿地面粗糙度贴图：暗=光滑（积水），亮=粗糙（干）
const asphaltRoughTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#7a7a7a'; ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 90; i++) {
    const r = 8 + Math.random() * 46;
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
    const dark = Math.random() > 0.35;
    g.addColorStop(0, dark ? 'rgba(10,10,10,0.85)' : 'rgba(210,210,210,0.5)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save();
    ctx.translate(Math.random() * 256, Math.random() * 256);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 0, r, r * (0.4 + Math.random() * 0.6), Math.random() * 3, 0, 7); ctx.fill();
    ctx.restore();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
})();

// 建筑窗户网格纹理（规则排列 + 随机亮灯）
function windowGridTex(cols, rows, litRatio, warm) {
  const cw = 32, ch = 40;
  const c = document.createElement('canvas');
  c.width = cols * cw; c.height = rows * ch;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0a0e1a'; ctx.fillRect(0, 0, c.width, c.height);
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const on = Math.random() < litRatio;
      if (!on) { ctx.fillStyle = 'rgba(18,24,40,0.85)'; }
      else {
        const palette = warm
          ? ['#ffd79a', '#ffc274', '#ffe9c4', '#ffb35c']
          : ['#9ad4ff', '#bfe6ff', '#7fc4ff', '#e2f4ff'];
        ctx.fillStyle = palette[Math.floor(Math.random() * palette.length)];
        ctx.globalAlpha = 0.55 + Math.random() * 0.45;
      }
      ctx.fillRect(x * cw + 7, y * ch + 9, cw - 14, ch - 20);
      ctx.globalAlpha = 1;
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// ============================================================
// 天空穹顶 / 环境贴图
// ============================================================
function makeSkyDome() {
  const geo = new THREE.SphereGeometry(150, 40, 24);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      top: { value: new THREE.Color(0x04060f) },
      mid: { value: new THREE.Color(0x0d1430) },
      bot: { value: new THREE.Color(0x1d2748) },
      violet: { value: new THREE.Color(0x231d44) }
    },
    vertexShader: `varying vec3 vN; void main(){ vN = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `varying vec3 vN; uniform vec3 top; uniform vec3 mid; uniform vec3 bot; uniform vec3 violet;
      void main(){
        float h = clamp(vN.y, -1.0, 1.0) * 0.5 + 0.5;
        vec3 c = mix(bot, mid, smoothstep(0.02, 0.42, h));
        c = mix(c, top, smoothstep(0.46, 0.94, h));
        float v = pow(clamp(1.0 - abs(vN.y), 0.0, 1.0), 2.2);
        c = mix(c, violet, v * 0.42);
        // 云层微弱起伏，避免纯渐变塑料感
        float cloud = sin(vN.x * 7.0 + vN.z * 5.0) * sin(vN.z * 6.0 - vN.x * 4.0);
        c += cloud * 0.012 * smoothstep(0.5, 1.0, h);
        gl_FragColor = vec4(c, 1.0);
      }`
  });
  scene.add(new THREE.Mesh(geo, mat));
}
makeSkyDome();

function makeEnv() {
  const pmrem = new THREE.PMREMGenerator(renderer);
  const s = new THREE.Scene();
  const geo = new THREE.SphereGeometry(40, 32, 16);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      top: { value: new THREE.Color(0x04060f) },

    },
    vertexShader: `varying vec3 vN; void main(){ vN = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `varying vec3 vN; uniform vec3 top; uniform vec3 mid; uniform vec3 bot;
      void main(){ float h = clamp(vN.y, -1.0, 1.0) * 0.5 + 0.5; vec3 c = mix(bot, mid, smoothstep(0.0, 0.5, h)); c = mix(c, top, smoothstep(0.5, 1.0, h)); gl_FragColor = vec4(c, 1.0); }`
  });
  s.add(new THREE.Mesh(geo, mat));
  const neons = [
    { c: 0xffb060, x: 0, y: 8, z: 18, r: 6 },
    { c: 0x3f7dff, x: -2, y: 12, z: 14, r: 4 },
    { c: 0xff6a9a, x: 15, y: 9, z: 10, r: 2.6 },
    { c: 0x5ad8ff, x: -15, y: 8, z: 12, r: 2.6 },
    { c: 0xffcf80, x: -10, y: 10, z: -6, r: 3.4 }
  ];
  for (const n of neons) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(n.r, 16, 12), new THREE.MeshBasicMaterial({ color: n.c }));
    m.position.set(n.x, n.y, n.z);
    s.add(m);
  }
  const env = pmrem.fromScene(s, 0.04).texture;
  pmrem.dispose();
  return env;
}

// 平面镜面反射：湿地面真倒影（镜像相机 + 斜裁剪 + 投影贴图）
// ============================================================
const REFL_PLANE_Y = 0.083;
const reflRT = new THREE.WebGLRenderTarget(1024, 1024, {
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  type: THREE.HalfFloatType
});
const reflCam = new THREE.PerspectiveCamera();
const reflTexMatrix = new THREE.Matrix4();

// 湿度遮罩：低洼积水处反射强，干处几乎不反
const wetTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#2a2a2a'; ctx.fillRect(0, 0, 256, 256);
  ctx.filter = 'blur(9px)';
  for (let i = 0; i < 34; i++) {
    const r = 14 + Math.random() * 52;
    ctx.fillStyle = `rgba(255,255,255,${0.35 + Math.random() * 0.6})`;
    ctx.beginPath();
    ctx.ellipse(Math.random() * 256, Math.random() * 256, r, r * (0.5 + Math.random() * 0.6), Math.random() * 3, 0, 7);
    ctx.fill();
  }
  ctx.filter = 'none';
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
})();

const reflMat = new THREE.ShaderMaterial({
  uniforms: {
    tRefl: { value: reflRT.texture },
    tWet: { value: wetTex },
    uTexMatrix: { value: reflTexMatrix },
    uStrength: { value: 0.66 }
  },
  vertexShader: /* glsl */`
    uniform mat4 uTexMatrix;
    varying vec4 vProj;
    varying vec3 vW;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vW = wp.xyz;
      vProj = uTexMatrix * wp;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D tRefl;
    uniform sampler2D tWet;
    uniform float uStrength;
    varying vec4 vProj;
    varying vec3 vW;
    void main() {
      vec2 uv = vProj.xy / vProj.w;
      if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) discard;

      // 水面微扰 + 竖直方向多次采样（湿地倒影天然是纵向拉丝、边界发糊）
      float wob = sin(vW.z * 5.5 + vW.x * 2.7) * 0.0009
                + sin(vW.x * 9.0 - vW.z * 3.1) * 0.0006;
      vec3 refl = vec3(0.0);
      for (int i = 0; i < 5; i++) {
        float o = (float(i) - 2.0) * 0.0014;
        refl += texture2D(tRefl, vec2(uv.x + wob, uv.y + o)).rgb;
      }
      refl /= 5.0;
      // 倒影略微去饱和（湿沥青不是镜子，彩光会被压掉一部分）
      float rl = dot(refl, vec3(0.2126, 0.7152, 0.0722));
      refl = mix(vec3(rl), refl, 0.78);

      // 湿度遮罩 + 掠射角增强（贴近地面看时反射最强）
      float wet = texture2D(tWet, vW.xz * 0.055).r;
      wet = smoothstep(0.36, 0.86, wet);
      vec3 V = normalize(cameraPosition - vW);
      float fres = pow(1.0 - clamp(abs(V.y), 0.0, 1.0), 1.5);
      float k = (0.10 + 0.90 * wet) * mix(0.30, 1.0, fres) * uStrength;

      gl_FragColor = vec4(refl * k * vec3(0.94, 0.97, 1.0), 1.0);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  side: THREE.DoubleSide
});

const reflPlane = new THREE.Mesh(new THREE.PlaneGeometry(24.4, 24.4), reflMat);
reflPlane.rotation.x = -Math.PI / 2;
reflPlane.position.y = REFL_PLANE_Y;
reflPlane.renderOrder = 1;

const _rView = new THREE.Vector3();
const _rFwd = new THREE.Vector3();
const _rUp = new THREE.Vector3();
const _rTarget = new THREE.Vector3();
const _rPlane = new THREE.Plane();
const _rClip = new THREE.Vector4();
const _rQ = new THREE.Vector4();
const _rN = new THREE.Vector3(0, 1, 0);

function renderReflection() {
  if (camera.position.y <= REFL_PLANE_Y + 0.5) return;

  // 1. 镜像相机位置
  reflCam.position.set(camera.position.x, 2 * REFL_PLANE_Y - camera.position.y, camera.position.z);

  // 2. 镜像朝向（法线为 +Y，向量反射即 y 取反）
  camera.getWorldDirection(_rFwd);
  _rTarget.copy(camera.position).addScaledVector(_rFwd, 12);
  _rTarget.y = 2 * REFL_PLANE_Y - _rTarget.y;
  _rUp.set(0, 1, 0).applyQuaternion(camera.quaternion);
  reflCam.up.set(_rUp.x, -_rUp.y, _rUp.z);
  reflCam.lookAt(_rTarget);

  // 3. 相机参数与投影矩阵
  reflCam.fov = camera.fov;
  reflCam.aspect = camera.aspect;
  reflCam.near = camera.near;
  reflCam.far = camera.far;
  reflCam.updateMatrixWorld();
  reflCam.projectionMatrix.copy(camera.projectionMatrix);

  // 4. 投影贴图矩阵：bias * P * V
  const pm = reflCam.projectionMatrix;
  reflTexMatrix.set(
    0.5, 0.0, 0.0, 0.5,
    0.0, 0.5, 0.0, 0.5,
    0.0, 0.0, 0.5, 0.5,
    0.0, 0.0, 0.0, 1.0
  );
  reflTexMatrix.multiply(pm);
  reflTexMatrix.multiply(reflCam.matrixWorldInverse);

  // 5. 渲染：整个底座（含镜面自身与地面）都不该出现在自己的倒影里
  const prevBase = baseGroup.visible;
  baseGroup.visible = false;
  for (const o of noRefl) o.visible = false;
  const prevTarget = renderer.getRenderTarget();
  renderer.setRenderTarget(reflRT);
  renderer.clear();
  renderer.render(scene, reflCam);
  renderer.setRenderTarget(prevTarget);
  baseGroup.visible = prevBase;
  for (const o of noRefl) o.visible = true;
}

function tree(x, z, s = 1) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s); props.add(g);
  // 树干 + 分枝
  add(g, new THREE.CylinderGeometry(0.1, 0.17, 1.9, 10), cel(0x2e2418), { x: 0, y: 0.95, z: 0, outline: true });
  for (let i = 0; i < 3; i++) {
    const a = i * 2.1 + 0.4;
    const br = add(g, new THREE.CylinderGeometry(0.045, 0.07, 0.85, 8), cel(0x2a2016),
      { x: Math.cos(a) * 0.22, y: 1.95, z: Math.sin(a) * 0.22 });
    br.rotation.z = Math.cos(a) * 0.55;
    br.rotation.x = Math.sin(a) * 0.55;
  }
  // 叶簇（低面数球，比圆锥塔自然得多）
  const leaf = cel(0x24463a, { shadow: 0x162c24, rim: 0x3d7355 });
  const clusters = [
    [0, 2.62, 0, 0.98, true],
    [-0.58, 2.28, 0.26, 0.64, false],
    [0.54, 2.34, -0.3, 0.68, false],
    [0.08, 3.15, 0.12, 0.56, false],
    [-0.3, 2.95, -0.42, 0.5, false]
  ];
  for (const [cx, cy, cz, r, ol] of clusters) {
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 0), leaf);
    m.position.set(cx, cy, cz);
    m.rotation.set(cx * 1.7, cy * 1.3, cz * 1.9);
    g.add(m);
    if (ol) {
      const om = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 0), outlineMat);
      om.position.copy(m.position);
      om.rotation.copy(m.rotation);
      om.scale.setScalar(1.05);
      g.add(om);
    }
  }
  blobShadow(props, x, z, 2.4, 0.45);
  return g;
}

// ============================================================
// 雨（LineSegments 雨丝，非圆点）
// ============================================================
const RAIN_COUNT = 3200;
const rainGeo = new THREE.BufferGeometry();
const rainHead = new Float32Array(RAIN_COUNT * 3);   // x,y,z
const rainLen = new Float32Array(RAIN_COUNT);
const rainPos = new Float32Array(RAIN_COUNT * 6);
const RAIN_SPAN = 34, RAIN_TOP = 12;
for (let i = 0; i < RAIN_COUNT; i++) {
  rainHead[i * 3] = (Math.random() - 0.5) * RAIN_SPAN;
  rainHead[i * 3 + 1] = Math.random() * RAIN_TOP;
  rainHead[i * 3 + 2] = (Math.random() - 0.5) * RAIN_SPAN;
  rainLen[i] = 0.42 + Math.random() * 0.62;
}
function writeRain() {
  for (let i = 0; i < RAIN_COUNT; i++) {
    const x = rainHead[i * 3], y = rainHead[i * 3 + 1], z = rainHead[i * 3 + 2];
    const L = rainLen[i];
    rainPos[i * 6] = x; rainPos[i * 6 + 1] = y; rainPos[i * 6 + 2] = z;
    rainPos[i * 6 + 3] = x + L * 0.20; rainPos[i * 6 + 4] = y - L; rainPos[i * 6 + 5] = z;
  }
}
writeRain();
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rain = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({
  color: 0x9dc0ff, transparent: true, opacity: 0.26,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
rain.frustumCulled = false;
scene.add(rain);

// 远处细雨幕（一层极淡的大范围雨，拉开纵深）
const mistRain = (() => {
  const N = 900;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(N * 6);
  for (let i = 0; i < N; i++) {
    const x = (Math.random() - 0.5) * 90, y = Math.random() * 22, z = -12 - Math.random() * 55;
    const L = 1.4 + Math.random() * 1.4;
    pos.set([x, y, z, x + L * 0.2, y - L, z], i * 6);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
    color: 0x6f90c8, transparent: true, opacity: 0.10, blending: THREE.AdditiveBlending, depthWrite: false
  }));
  m.frustumCulled = false;
  scene.add(m);
  return { mesh: m, geo };
})();

// ============================================================
// 动画
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // 雨
  for (let i = 0; i < RAIN_COUNT; i++) {
    rainHead[i * 3] -= 1.9 * dt;
    rainHead[i * 3 + 1] -= 11.0 * dt;
    if (rainHead[i * 3 + 1] < 0) {
      rainHead[i * 3] = (Math.random() - 0.5) * RAIN_SPAN;
      rainHead[i * 3 + 1] = RAIN_TOP + Math.random() * 2;
      rainHead[i * 3 + 2] = (Math.random() - 0.5) * RAIN_SPAN;
    }
    if (rainHead[i * 3] < -RAIN_SPAN / 2) rainHead[i * 3] += RAIN_SPAN;
  }
  writeRain();
  rainGeo.attributes.position.needsUpdate = true;

  // 涟漪
  for (const r of ripples) {
    const cyc = (t * r.speed + r.base) % 1.8;
    const k = cyc / 1.8;
    r.mesh.scale.setScalar(0.35 + k * 2.4);
    r.mesh.material.opacity = Math.max(0, 0.42 * (1 - k) * (1 - k));
  }

  // 霓虹微闪
  for (const f of flickers) {
    const n = Math.sin(t * f.speed) * 0.6 + Math.sin(t * f.speed * 3.7) * 0.4;
    f.obj.opacity = Math.max(0, f.base + n * f.amp);
  }

  finalPass.uniforms.uTime.value = t;

  // 人物轻微呼吸/撑伞晃动，避免"定格模型"感
  for (const pw of pedestrians) {
    pw.g.rotation.z = Math.sin(t * 0.9 + pw.phase) * 0.012;
    pw.g.position.y = Math.sin(t * 1.35 + pw.phase) * 0.008;
  }

  controls.update();
  renderReflection();
  composer.render();


}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  finalPass.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
});
